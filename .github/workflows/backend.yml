name: Backend CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    paths:
      - "backend/**"
      - "content/**"
      - "API_CONTRACT.md"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
